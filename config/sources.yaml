    list_url: "https://tks.mysteel.com/article/pa6942a01,0311aaaaa{page}.html"
    max_pages: 1
    allow_regional: true
    title_include_keywords: [产量, 发运, 指引, 减产, 停产, 复产, 事故, 天气, 港口, 铁路, 中断, 恢复]

  - id: iron_steel_events
