  # ============ 综合分钟级快讯：只保留黑色系首次披露事件 ============
  - id: black_market_flash
    variety: [rebar, ironore, cokingcoal, coke]
    channel: news
    report_type: event
    list_url: "https://m.mysteel.com/"
    max_pages: 1
    allow_regional: true
    exclude_keyword_exceptions: [会议]
    title_exclude_keywords: [早读, 午报, 晚餐, 早报, 日报, 周报, 月报, 概率, 预计, 预期, 或将, 有望]
    required_keyword_groups:
      - [钢铁, 钢厂, 高炉, 铁水, 螺纹, 建筑钢材, 铁矿, 矿山, 焦煤, 焦炭, 煤矿, 洗煤, 焦企, 蒙煤, 口岸]
      - [停产, 复产, 检修, 限产, 减产, 事故, 中断, 恢复, 关闭, 复通, 政策, 提涨, 提降, 发运, 到港, 调价]
