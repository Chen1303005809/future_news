    list_url: "https://coal.mysteel.com/article/p-5153,5166,5167,5168-------------{page}.htm"
    max_pages: 2
    title_include_keywords: [矿山, 洗煤厂, 独立焦企, 焦化厂, 钢厂, 生产调研, 开工, 产能利用率, 库存, 可用天数]

