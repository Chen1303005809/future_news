# 黑色系现货资讯抓取栏目配置
#
# 只保留对未来数小时至 3 个交易日有潜在增量价值的栏目，不再设置栏目等级。
# 栏目顺序有意义：结构化数据和专项事件源排在宽泛日报、
# 综合快讯之前，避免同一 URL 首次入库时被标成过于宽泛的 source_id。
#
# 品种标识：
#   rebar       螺纹钢（建筑钢材）
#   ironore     铁矿石
#   cokingcoal  焦煤
#   coke        焦炭
#
# report_type: daily / weekly / monthly / data / analysis / event
# is_datas:    栏目位于 /datas/ 路径，仅作来源说明，解析逻辑相同
#
# 可选的栏目级标题约束：
#   title_include_keywords: 命中任一词才保留
#   title_exclude_keywords: 命中任一词即丢弃
#   required_keyword_groups: 每组至少命中一个词；适合“品种词 + 事件词”双门槛
#   allow_regional: 允许保留地区性事件（全局地区过滤不生效）
#   exclude_keyword_exceptions: 本栏目允许出现的全局排除词
#
# URL 可包含 {page}；没有分页的首页型信息流直接填写固定 URL。

sources:
  # ============ 螺纹钢：结构化供需 + 全国行情背景 ============
  - id: rebar_inventory
    variety: [rebar]
    channel: jiancai
    report_type: data
    list_url: "https://jiancai.mysteel.com/article/pa4860a010101aaaaa{page}.html"
    max_pages: 2
    title_include_keywords: [库存, 产量, 表观需求, 产量库存速递]

  - id: steelmill_events
    variety: [rebar, ironore, cokingcoal, coke]
    channel: factory
    report_type: event
    list_url: "https://factory.mysteel.com/"
    max_pages: 1
    allow_regional: true
    required_keyword_groups:
      - [钢厂, 高炉, 电炉, 建筑钢材, 螺纹, 线材, 盘螺]
      - [检修, 停产, 复产, 限产, 减产, 旬价, 结算价]

  - id: rebar_daily
    variety: [rebar]
    channel: jiancai
    report_type: daily
    list_url: "https://jiancai.mysteel.com/article/pa12a010101aaaaa{page}.html"
    max_pages: 2

