    list_url: "https://tks.mysteel.com/datas/article/pa4260,7200aaaaaa{page}.html"
    max_pages: 2
    title_include_keywords: [港口库存, 港存, 疏港, 在港船舶, 海外七港]

  - id: iron_pigiron_output
    variety: [ironore]
