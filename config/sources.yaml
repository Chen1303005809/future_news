# 黑色系现货资讯抓取栏目配置
#
# 品种标识：
#   rebar       螺纹钢（建筑钢材）
#   ironore     铁矿石
#   cokingcoal  焦煤
#   coke        焦炭
#
# report_type: daily / weekly / monthly / data / analysis
# priority:    core（必抓）/ optional（建议或低频）
# is_datas:    栏目位于 /datas/ 路径（铁矿石数据型栏目），仅标记，解析逻辑相同
#
# URL 模板中 {page} 为页码占位符，从 1 开始。
#
# 标题黑名单（命中则丢弃）见下方 title_blacklist。

title_blacklist:
  - 会议
  - 评选
  - 通知
  - 招聘
  - 广告
  - 征文
  - 活动
  - 报名
  - 招标
  - 中标公示

# 期货价格类栏目已按需求排除（预测端已有期货价数据源）：
#   - 黑色期货早报（tks 首页系列）
#   - 连铁主力合约成交持仓（tks pa4231）
# 如后续需要成本端（钢坯/废钢/海运费/普氏），在此追加即可，无需改代码。

sources:
  # ============ 螺纹钢（建材）============
  - id: rebar_daily
    variety: [rebar]
    channel: jiancai
    report_type: daily
    priority: core
    list_url: "https://jiancai.mysteel.com/article/pa12a010101aaaaa{page}.html"
    max_pages: 2

  - id: rebar_weekly
